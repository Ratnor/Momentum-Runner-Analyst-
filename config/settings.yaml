# Momentum Runner Scanner - all thresholds, sizing and schedule.
# Nothing in the code is hard-coded; every number below is read from here.
# Values marked "SPEC" come straight from the build spec. Values marked
# "TBD" were not given in the spec and are starting guesses to confirm.

sleeve:
  starting_capital: 2500.0        # SPEC: funded once, never topped up
  kill_switch_equity: 1500.0      # SPEC: equity <= this -> no new buys (-40%)
  kill_switch_reset: false        # SPEC: reset only by editing config (set true once, then back)

sizing:
  risk_pct: 0.016                 # SPEC: 1.6% of current sleeve equity per trade
  stop_pct: 0.15                  # SPEC: stop = max(entry*(1-stop_pct), pullback_low - offset)
  stop_below_low_offset: 0.01     # SPEC: $0.01 below pullback low
  max_position_dollars: 500.0     # SPEC
  max_open_positions: 5           # SPEC
  reentry_cooldown_sessions: 10   # SPEC
  trade_budget: 20                # SPEC: then mandatory expectancy review

scoring:
  headline_min_score: 5           # TBD: not set in spec. 5 lets Phase 2 / IND / M&A pass alone
  body_weight: 0.4                # SPEC (open item: confirm after phase 2 fixtures)
  catalyst_max_age_days: 10       # SPEC

sector:
  biotech_sic_codes: [2834, 2835, 2836, 8731]   # SPEC
  prerev_max_revenue: 1000000.0   # TBD: "pre-revenue" = latest annual revenue below this

filters:
  allowed_exchanges: ["NASDAQ", "NYSE AMERICAN"]   # SPEC: no OTC
  price_min: 1.00                 # SPEC
  price_max: 5.00                 # SPEC
  mcap_min: 5000000.0             # SPEC
  mcap_max: 50000000.0            # SPEC
  float_max: 8000000.0            # SPEC: shares
  rvol_min: 3.0                   # SPEC: trigger-day volume / avg volume
  rvol_lookback_days: 20          # SPEC
  dollar_vol_min: 500000.0        # SPEC
  spread_proxy_max: 0.50          # TBD: (High - Low) / Close sanity cap on daily bars
  spread_max: 0.03                # SPEC: true bid-ask spread, once live quotes exist

risk_flags:
  dilution_lookback_days: 90      # SPEC
  dilution_penalty: -6            # SPEC
  lockup_window_days: 10          # SPEC
  lockup_penalty: -5              # SPEC
  holder_13d_min_pct: 0.10        # SPEC
  holder_13d_penalty: -4          # SPEC
  insider_selling_lookback_days: 30   # SPEC
  insider_selling_penalty: -4     # SPEC
  short_interest_min_pct: 0.20    # SPEC: of float
  short_interest_bonus: 2         # SPEC: squeeze fuel (stale data)
  reverse_split_lookback_days: 365    # SPEC: 12 months
  reverse_split_penalty: -4       # SPEC

entry:
  pullback_window_days: 3         # SPEC: pullback must occur on days 1-3
  fill_window_days: 5             # SPEC: no fill by day 5 -> drop
  buy_stop_offset: 0.01           # SPEC: trigger = pullback high + $0.01
  limit_above_trigger_pct: 0.03   # SPEC: limit 3% above trigger

exits:
  default_strategy: scale_trail   # SPEC: fixed_double | scale_trail | trail_only
  target_multiple: 2.0            # SPEC: target = entry x 2.0
  target_sell_fraction: 0.5       # SPEC: sell half at target
  trail_pct: 0.25                 # SPEC: trail = highest close x (1 - 0.25)
  time_stop_sessions: 5           # SPEC
  time_stop_min_gain: 0.10        # SPEC: needs a close >= entry x 1.10
  max_hold_sessions: 20           # SPEC

broker:
  mode: paper                     # SPEC: paper (v1) | manual (v2) | ibkr (v3)
  slippage_pct: 0.01              # SPEC: each side
  commission_per_trade: 0.0       # SPEC: configurable

data:
  db_path: data/scanner.db
  cache_dir: data/cache
  reports_dir: reports
  sec_max_requests_per_sec: 8     # SPEC: stay under SEC's 10/s
  http_timeout_sec: 20
  http_max_retries: 3

schedule:
  timezone: America/New_York
  market_calendar: NYSE

alerts:
  primary: telegram               # SPEC: telegram, gmail as fallback
  fallback: gmail

backtest:
  in_sample_start: "2023-01-01"   # SPEC
  in_sample_end: "2024-12-31"     # SPEC
  out_of_sample_start: "2025-01-01"   # SPEC
  out_of_sample_end: "2026-10-31"     # SPEC
  after_close_cutoff: "16:00"     # SPEC: accepted after this (ET) -> next session
  mcap_buckets: [5000000.0, 15000000.0, 30000000.0, 50000000.0]   # SPEC
