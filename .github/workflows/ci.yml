name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Create journal DB from schema
        run: |
          python -m scanner.journal
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("data/scanner.db")
          tables = sorted(r[0] for r in conn.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"))
          print("tables:", tables)
          PY
